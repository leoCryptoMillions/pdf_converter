[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-converter"
version = "0.7.0"
description = "Single-user digital PDF conversion to editable Word, Excel and text"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
pdf-converter = "apps.local_review_ui:main"
pdf-convert = "apps.convert:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-mvp.txt"]}

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
apps = ["local_review_assets/*.html", "local_review_assets/*.css", "local_review_assets/*.js", "local_review_assets/*.json", "local_review_assets/*.png"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["apps", "packages"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
]
ignore_errors = true

[tool.coverage.run]
branch = true
patch = ["subprocess"]
concurrency = ["multiprocessing"]
sigterm = true
source = ["apps", "packages"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if 0:",
    "if False:",
]
precision = 2

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "fixme",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 7
max-arguments = 6
