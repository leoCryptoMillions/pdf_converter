[pytest]
# Pytest configuration for PDF Converter project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Markers for organizing tests
markers =
    mvp: Critical local Word/Excel workflow (about half the suite)
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (databases, services)
    e2e: End-to-end tests (full workflow)
    security: Security-related tests
    slow: Slow tests (OCR, actual PDF processing)
    skip_ci: Tests that should skip in CI environment

# Daily MVP selection; run -m "mvp or not mvp" for the complete suite.
# Coverage remains an explicit release check (make test-coverage).
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    -m mvp

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
