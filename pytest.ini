[pytest]
# Pytest configuration for PDF Converter project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (databases, services)
    e2e: End-to-end tests (full workflow)
    security: Security-related tests
    slow: Slow tests (OCR, actual PDF processing)
    skip_ci: Tests that should skip in CI environment

# Coverage options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --cov=apps
    --cov=packages
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    --cov-fail-under=70

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Timeout for tests (in seconds)
timeout = 300

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
