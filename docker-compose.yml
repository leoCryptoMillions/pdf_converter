version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pdf-converter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pdf_converter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf-converter-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: pdf-converter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf-converter-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pdf-converter-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf-converter-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: pdf-converter-api
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pdf_converter
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: development
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pdf-converter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for PDF processing
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: pdf-converter-worker
    command: celery -A apps.worker.tasks worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pdf_converter
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: development
      DEBUG: "False"
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - /app/.venv
      - /tmp/pdf-converter-storage:/tmp/pdf-converter-storage
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - pdf-converter-network

  # Celery Beat for scheduled tasks
  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: pdf-converter-beat
    command: celery -A apps.worker.tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/pdf_converter
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: development
      DEBUG: "False"
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - pdf-converter-network

  # Frontend (React + Vite) - Optional, can run separately
  # frontend:
  #   build:
  #     context: ./apps/web
  #     dockerfile: Dockerfile
  #   container_name: pdf-converter-web
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #   volumes:
  #     - ./apps/web:/app
  #     - /app/node_modules
  #   networks:
  #     - pdf-converter-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  pdf-converter-network:
    driver: bridge

# Usage:
# docker-compose up -d                 # Start all services
# docker-compose logs -f api           # View API logs
# docker-compose logs -f worker        # View worker logs
# docker-compose exec api bash         # Enter API container
# docker-compose down                  # Stop all services
# docker-compose down -v               # Stop and remove volumes
