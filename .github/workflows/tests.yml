name: MVP release checks (manual)

on:
  # Keep the established manual-only policy. This does not enable repository Actions.
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-mvp-dev.lock
      - run: npm ci
      - run: npx playwright install chromium
      - name: Complete regression, coverage, wheel, inventory, browser and vulnerability audit
        run: python -m scripts.check_release --audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-checks-windows
          path: |
            .generated/release-check/
            .generated/ui-check/
            .generated/docx-review/
