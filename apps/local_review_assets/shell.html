<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{title} · PDF Converter</title>
  <link rel="icon" href="data:,">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/help.css">
  <script src="/assets/app.js" defer></script>
  <script src="/assets/help.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="PDF Converter, inicio">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h5"/></svg></span>
      <span>PDF<span class="brand-light">Converter</span></span>
    </a>
    <div class="header-actions">
      <span class="local-badge"><span class="status-dot" aria-hidden="true"></span> En tu equipo <span class="version">/ F0</span></span>
      <div class="action-with-help header-help">
        <details class="help-menu">
          <summary>Ayuda <span aria-hidden="true">⌄</span></summary>
          <nav aria-label="Menú Ayuda"><a href="/ayuda">Centro de ayuda</a><a href="/ayuda#faq">Preguntas frecuentes</a><a href="/ayuda#guia">Guía de uso</a></nav>
        </details>
        {menu_help}
      </div>
      <div class="theme-control">
        <button type="button" id="theme-toggle" class="theme-toggle" data-help-action="theme" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro" hidden>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-label" class="theme-label">Modo oscuro</span>
        </button>
        {theme_help}
      </div>
    </div>
  </header>
  <main id="main" class="container">
    {body}
  </main>
  <footer class="site-footer">
    <span>PDF Converter <span class="footer-dot">·</span> Prototipo local</span>
    <span>Un documento a la vez. A tu ritmo.</span>
  </footer>
  <dialog id="context-dialog" class="context-dialog" aria-labelledby="context-title" aria-describedby="context-body">
    <div class="context-header">
      <img src="/assets/pdf-converter-guide.png" width="80" height="80" alt="PDF Converter" decoding="async" loading="lazy">
      <div><p class="eyebrow">PDF CONVERTER TE GUÍA</p><h2 id="context-title">Ayuda</h2></div>
      <button type="button" id="context-close" class="icon-button" aria-label="Cerrar ayuda" title="Cerrar ayuda">×</button>
    </div>
    <div id="context-body" class="context-body"></div>
    <a id="context-more" href="/ayuda" class="technical-download">Ver en el centro de ayuda</a>
  </dialog>
  {help_templates}
</body>
</html>
